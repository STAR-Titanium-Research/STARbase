# D1-Database — full stack definition.
#
# Phase 2: healthchecks, restart policies, reverse proxy (Caddy),
# and MinIO bucket bootstrap added. Config from `.env` (copy from `.env.example`).
#
# Security defaults:
#   * Every published host port binds to ${D1_BIND_ADDR:-127.0.0.1}, i.e. loopback only. Keep the
#     default when Tailscale Serve on the host fronts the proxy; set the host's tailnet IP only if
#     clients must reach the ports directly (never 0.0.0.0). See infra/README.md.
#   * Secrets use ${VAR:?} so `docker compose` refuses to start without them: there are no
#     working default passwords. Non-secret settings keep ${VAR:-default}.
name: d1-database

services:
  # The durable core (ADR-0001). pgvector image = Postgres + pgvector extension.
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-d1}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (openssl rand -hex 32)}
      POSTGRES_DB: ${POSTGRES_DB:-d1_database}
    ports:
      - "${D1_BIND_ADDR:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [d1net]

  # Job queue for the heavy-data pipeline (Phase 4).
  # rq pickles jobs, so anyone who can talk to Redis can run code in the workers: it is NOT
  # published on the host (reach it with `docker compose exec redis redis-cli`) and it
  # requires REDIS_PASSWORD. REDISCLI_AUTH lets redis-cli (healthcheck, `exec`) authenticate.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Persist every 60 s if at least 1 key changed; quiet logs.
    command:
      - sh
      - -c
      - exec redis-server --save 60 1 --loglevel warning --requirepass "$$REDIS_PASSWORD"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env (openssl rand -hex 32)}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [d1net]

  # S3-compatible object storage for 10-100 GB files (bypasses the API layer).
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env (openssl rand -hex 32)}
    ports:
      - "${D1_BIND_ADDR:-127.0.0.1}:${MINIO_API_PORT:-9000}:9000"
      - "${D1_BIND_ADDR:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [d1net]

  # Swappable adapter (ADR-0002): UI / REST / GraphQL / RBAC over OUR schema.
  # Introspects but does NOT alter structure — schema is owned by our migrations.
  directus:
    image: directus/directus:11
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KEY: ${DIRECTUS_KEY:?Set DIRECTUS_KEY in .env (openssl rand -hex 32)}
      SECRET: ${DIRECTUS_SECRET:?Set DIRECTUS_SECRET in .env (openssl rand -hex 32)}
      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-d1_database}
      DB_USER: ${POSTGRES_USER:-d1}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (openssl rand -hex 32)}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD:?Set DIRECTUS_ADMIN_PASSWORD in .env (openssl rand -hex 32)}
      # Public URL used for link generation; override in .env for production.
      PUBLIC_URL: ${DIRECTUS_PUBLIC_URL:-http://localhost:80}
      # CORS for the standalone Force App (apps/force-app/web). It runs on its OWN origin and
      # calls Directus (/items, /assets, /auth) cross-origin with Bearer tokens, so Directus
      # must echo CORS headers for that origin. Comma-separate multiple origins in .env.
      CORS_ENABLED: "true"
      CORS_ORIGIN: ${FORCE_APP_ORIGIN:-http://localhost:5180}
      # Auto-load local extensions (the actor-identity audit hook).
      EXTENSIONS_AUTO_RELOAD: "true"
      # NOTE: we deliberately do NOT declare a `star` storage location. The
      # archive files (directus_files.storage='star') are browse/link only — users
      # open them via UNC/Explorer (d1-archive-links), never downloaded through
      # Directus. Declaring `star` as a local driver makes Directus try to mkdir /
      # write-probe its root, which fails for a read-only, mount-less location and
      # turns the container unhealthy. Listing/linking works fine without it.
      STORAGE_LOCATIONS: local
      # Path B (Ask-the-Database): the d1-ask-endpoint extension proxies chat
      # requests to the guarded text-to-SQL plugin over the internal d1net.
      LLM_PLUGIN_URL: ${LLM_PLUGIN_URL:-http://llm-text-to-sql:8080}
      WORKER_WEBHOOK_SECRET: ${WORKER_WEBHOOK_SECRET:?Set WORKER_WEBHOOK_SECRET in .env (openssl rand -hex 32)}
      # Lets the worker-webhook Flows send `X-Worker-Secret: {{$env.WORKER_WEBHOOK_SECRET}}`; the
      # workers reject every request without it (docs/runbooks/heavy-data-pipeline.md §3).
      FLOWS_ENV_ALLOW_LIST: WORKER_WEBHOOK_SECRET
      # The container runs in UTC; d1-report prints label dates in this IANA zone instead.
      D1_TIMEZONE: ${D1_TIMEZONE:-Europe/London}
    # Path A (built-in AI Chat) and any server-side extension that calls the host
    # can reach the host's Ollama here. Auto-resolved on Windows/Mac Docker
    # Desktop; the host-gateway mapping makes it work on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${D1_BIND_ADDR:-127.0.0.1}:${DIRECTUS_PORT:-8055}:8055"
    volumes:
      - directus-uploads:/directus/uploads
      # Mount the version-controlled hook extensions (read-only).
      - ./core/extensions:/directus/extensions:ro
      # The SMB archive (`archive_share`, below) is deliberately NOT mounted here: files there are
      # linked, not served, and only the `archive-indexer` service reads it.
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider",
             "http://127.0.0.1:8055/server/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      # Directus runs its own migrations on first boot — give it time.
      start_period: 60s
    networks: [d1net]

  # Heavy-data pipeline worker (Phase 4).
  # Exposes a webhook endpoint (Directus Flow target) and an rq worker that
  # parses large .d1f files from MinIO under a fixed memory ceiling.
  heavy-data-worker:
    build:
      context: plugins/heavy-data-worker
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Full URL incl. password; preferred over REDIS_HOST/REDIS_PORT (kept for compatibility).
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env (openssl rand -hex 32)}@redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env (openssl rand -hex 32)}
      MINIO_BUCKET: ${MINIO_BUCKET:-d1-files}
      DIRECTUS_URL: http://directus:8055
      WORKER_DIRECTUS_TOKEN: ${WORKER_DIRECTUS_TOKEN:-}
      WORKER_MEMORY_LIMIT_MB: ${WORKER_MEMORY_LIMIT_MB:-256}
      WORKER_WEBHOOK_SECRET: ${WORKER_WEBHOOK_SECRET:?Set WORKER_WEBHOOK_SECRET in .env (openssl rand -hex 32)}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-214748364800}
      WORKER_HTTP_PORT: "8080"
    ports:
      - "${D1_BIND_ADDR:-127.0.0.1}:${WORKER_HTTP_PORT:-8080}:8080"
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [d1net]

  # FFT / frequency-analysis plugin (Phase 5).
  # Triggered by a Directus Flow when a test_session file is ready for analysis.
  # Computes amplitude spectrum, dominant frequencies, and band energy per channel.
  analysis-worker:
    build:
      context: plugins/analysis-worker
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Full URL incl. password; preferred over REDIS_HOST/REDIS_PORT (kept for compatibility).
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env (openssl rand -hex 32)}@redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env (openssl rand -hex 32)}
      MINIO_BUCKET: ${MINIO_BUCKET:-d1-files}
      DIRECTUS_URL: http://directus:8055
      WORKER_DIRECTUS_TOKEN: ${WORKER_DIRECTUS_TOKEN:-}
      WORKER_WEBHOOK_SECRET: ${WORKER_WEBHOOK_SECRET:?Set WORKER_WEBHOOK_SECRET in .env (openssl rand -hex 32)}
      WORKER_HTTP_PORT: "8081"
      QUEUE_NAME: analysis
      FFT_CHANNEL_INDEX: "2"
    ports:
      - "${D1_BIND_ADDR:-127.0.0.1}:${ANALYSIS_HTTP_PORT:-8081}:8081"
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8081/health')"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [d1net]

  # Local LLM runtime for text-to-SQL and embeddings (Phase 6, spec §6).
  # Opt-in: in the "llm" profile so the heavy image/models are not pulled by
  # default. Start with:  docker compose --profile llm up -d
  # Pull models once after first start (see docs/runbooks/text-to-sql.md):
  #   docker compose exec ollama ollama pull llama3
  #   docker compose exec ollama ollama pull nomic-embed-text
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    profiles: ["llm"]
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "${D1_BIND_ADDR:-127.0.0.1}:${OLLAMA_PORT:-11434}:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [d1net]

  # Text-to-SQL API (Phase 6). Natural language in, guarded read-only SQL and
  # rows out. The LLM's SQL is validated by app.lib.sql_guard and executed only
  # through the d1_llm_readonly role (see ADR-0009). Also serves /api/search
  # (pgvector hybrid search) and /api/embed/backfill.
  llm-text-to-sql:
    build:
      context: plugins/llm-text-to-sql
      dockerfile: Dockerfile
    restart: unless-stopped
    # Always-on (not in the "llm" profile) so the Directus d1-ask-endpoint
    # extension can reach it on d1net for the Ask-the-Database chat page. It is
    # light (Flask/gunicorn) and only calls the LLM on demand.
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Read-only role DSN for executing LLM-authored SQL (defence-in-depth).
      LLM_DATABASE_URL: ${LLM_DATABASE_URL:-}
      # Writer DSN for the embedding backfill (writes semantic_embeddings).
      EMBED_DATABASE_URL: ${EMBED_DATABASE_URL:-}
      # Point at the host's Ollama (the one the maintainer already runs) rather
      # than the containerised `ollama` service. Swap back to http://ollama:11434
      # if you prefer the in-profile container (docker compose --profile llm up).
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_SQL_MODEL: ${OLLAMA_SQL_MODEL:-llama3}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      LLM_STATEMENT_TIMEOUT_MS: ${LLM_STATEMENT_TIMEOUT_MS:-5000}
      WORKER_WEBHOOK_SECRET: ${WORKER_WEBHOOK_SECRET:?Set WORKER_WEBHOOK_SECRET in .env (openssl rand -hex 32)}
      WORKER_HTTP_PORT: "8080"
    # Reach the host Ollama (see OLLAMA_URL above) from inside the container.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${D1_BIND_ADDR:-127.0.0.1}:${LLM_HTTP_PORT:-8082}:8080"
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [d1net]

  # FRM filter-service: interactive signal-filter previews for the force dashboard
  # (docs/superpowers/specs/2026-07-21-frm-filtering-suite-design.md). Fetches live
  # caches from Directus forwarding the CALLER'S credentials (no service account),
  # filters with scipy, returns decimated previews. Served same-origin via Caddy
  # at /filter/* — no published ports.
  filter-service:
    build:
      context: plugins/filter-service
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      directus:
        condition: service_healthy
    environment:
      DIRECTUS_URL: http://directus:8055
      CACHE_LRU: "4"
      # CORS for the standalone Force App: it calls /filter/* cross-origin with a Bearer token
      # (forwarded to Directus for asset authz) and reads the X-Filter-* response headers.
      FILTER_CORS_ORIGINS: ${FORCE_APP_ORIGIN:-http://localhost:5180}
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [d1net]

  # diag-service: interactive diagnostics-recipe previews for the Diagnostics Workbench
  # (docs/superpowers/specs/2026-09-01-diagnostics-recipe-workbench-design.md, Component 4).
  # Re-runs a recipe from the published base.d1an using the SAME scripts/diag engine the
  # orchestrator's bake uses. Forwards the caller's Directus credentials for authz (no service
  # account). Served same-origin via Caddy at /diag/* — no published ports.
  diag-service:
    build:
      context: .
      dockerfile: plugins/diag-service/Dockerfile
    restart: unless-stopped
    depends_on:
      directus:
        condition: service_healthy
    environment:
      DIRECTUS_URL: http://directus:8055
      OCTREE_ROOT: /srv/octrees
      # CORS for the standalone Force App, which calls /diag/* cross-origin with a Bearer token.
      DIAG_CORS_ORIGINS: ${FORCE_APP_ORIGIN:-http://localhost:5180}
    volumes:
      - ./infra/octrees:/srv/octrees:ro   # read base.d1an off the same mount Caddy serves
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks: [d1net]

  # Remote live-backup receiver for force-app recordings (apps/force-app/backup-server). The
  # acquisition PC streams raw D1RW chunks here for the duration of a recording, so a local disk
  # failure, power cut or crash on that machine can't take the capture with it; the same machine
  # can then pull the raw back and finalize it (POST /backup/restore/{id} on the recorder).
  #
  # Reached through Caddy at /backup-ingest/* rather than by publishing 8210 — that keeps it on the
  # single TLS, tailnet-only entry point instead of adding a second plaintext one. It has no auth
  # of its own (see the Caddyfile comment), which is why it must not be published directly.
  #
  # Storage is a named volume: raw captures are multi-GB and must survive a container recreate.
  # Retention is deliberately short (hours, not days) — this is a crash safety net, not an archive.
  backup-server:
    build:
      context: apps/force-app/backup-server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      BACKUP_STORAGE: /data
      BACKUP_RETENTION_HOURS: ${BACKUP_RETENTION_HOURS:-12}
    volumes:
      - backup-raw:/data
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8210/health')"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [d1net]

  # Relay that creates GitHub issues on behalf of force-app clients (apps/force-app/bug-report-relay).
  # Holds the GitHub App private key centrally so no acquisition PC needs a GitHub credential of its
  # own — the force-app backend on each machine calls this relay instead of api.github.com directly.
  #
  # Reached through Caddy at /bug-report-relay/* rather than by publishing its port, same as
  # backup-server above: it has no auth of its own (see the Caddyfile comment) and relies on the
  # tailnet-only entry point, so it must not be published directly.
  #
  # GITHUB_APP_PRIVATE_KEY_FILE_HOST points at the App's private key .pem on the host; it is bind-
  # mounted read-only rather than passed as an env var so the key never ends up in `.env` or `docker
  # inspect` output.
  bug-report-relay:
    build:
      context: apps/force-app/bug-report-relay
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY_PATH: /run/secrets/github-app-private-key.pem
      GITHUB_APP_INSTALLATION_ID: ${GITHUB_APP_INSTALLATION_ID:-}
      GITHUB_REPO: ${GITHUB_BUG_REPORT_REPO:-dpremoli/D1-Database}
    volumes:
      - ${GITHUB_APP_PRIVATE_KEY_FILE_HOST:-./secrets/github-app-private-key.pem}:/run/secrets/github-app-private-key.pem:ro
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8211/health')"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [d1net]

  # Reverse proxy: single HTTP entry point → Directus admin UI.
  # MinIO console and API remain directly accessible on their own ports.
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      directus:
        condition: service_healthy
    ports:
      - "${D1_BIND_ADDR:-127.0.0.1}:${PROXY_HTTP_PORT:-80}:80"
    # Reach the host-run recording backend (apps/force-app/backend on :8200) for the /recorder
    # same-origin proxy — it runs on the host because it needs the DAQ hardware, not in a container.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./infra/octrees:/srv/octrees:ro          # Potree octrees, served same-origin (Phase 2)
      - ./infra/force-app-updates:/srv/force-app-updates:ro   # Electron auto-update feed
      - ./apps/force-app/web/dist:/srv/force-app:ro   # standalone Force App SPA, served at /app/
      - caddy-data:/data
      - caddy-config:/config
    networks: [d1net]

  # One-off indexer for the SMB archive (`make index-archive`). Opt-in profile so a plain
  # `docker compose up` never tries to mount the share. Nothing else reads /mnt/archive.
  archive-indexer:
    image: python:3.12-slim
    profiles: ["archive"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-d1}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (openssl rand -hex 32)}@postgres:5432/${POSTGRES_DB:-d1_database}?sslmode=disable
      ARCHIVE_ROOT: /mnt/archive/star_group1
    volumes:
      - ./scripts:/scripts:ro
      - archive_share:/mnt/archive:ro
    command: ["sh", "-c", "pip install -q psycopg2-binary && python /scripts/index_archive.py"]
    networks: [d1net]

volumes:
  pgdata:
  redis-data:
  minio-data:
  directus-uploads:
  caddy-data:
  caddy-config:
  ollama-models:
  # In-flight recording backups (multi-GB raw D1RW files, auto-purged after
  # BACKUP_RETENTION_HOURS). Named so they survive `docker compose up --force-recreate`.
  backup-raw:

  # Read-only mount of the university SMB archive (Z: → \\uosfstore.shef.ac.uk\shared).
  # Used only by the `archive-indexer` service (profile `archive`, run by `make index-archive`);
  # the workers and Directus do not mount it. The whole `shared` export is mounted; only the
  # star_group1 subtree is used (STORAGE_STAR_ROOT and the indexer point at
  # /mnt/archive/star_group1). Credentials live in .env (SMB_USER / SMB_PASS). The mount is
  # read-only twice over: `ro` in the options AND `:ro` on the service mount.
  # If SMB negotiation fails, adjust `vers=` (try 3.1.1 or 2.1) or add `domain=`.
  archive_share:
    driver: local
    driver_opts:
      type: cifs
      device: "//${SMB_HOST:-uosfstore.shef.ac.uk}/${SMB_SHARE:-shared}"
      o: "username=${SMB_USER:-},password=${SMB_PASS:-},domain=${SMB_DOMAIN:-},ro,uid=1000,gid=1000,vers=3.0,file_mode=0444,dir_mode=0555,iocharset=utf8"

networks:
  d1net:
    driver: bridge
