<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Force App</title>
  <style>
    body { margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #0b1220; color: #cbd5e1; font: 14px system-ui, sans-serif; }
    .orb { width: 40px; height: 40px; margin-right: 14px; flex-shrink: 0; }
    .row { display: flex; align-items: center; }
  </style>
</head>
<body>
  <div class="row"><canvas class="orb" aria-hidden="true"></canvas>Starting the recorder backend&hellip;</div>
  <script>
    // The app's loading orb (Fx/Fy/Fz strands plaiting around a dotted sphere) for the splash the
    // shell shows before the web app exists. This page has no bundler, so it carries a plain-JS copy
    // of orbFrame() at the 64 px tuning: packages/force-plotting/src/thinkingOrb.ts is the source of
    // truth. Ported from thinking-orbs (github.com/Jakubantalik/thinking-orbs, MIT, (c) 2026 Jakub Antalik).
    (function () {
      var SIZE = 40, SPEED = 1.625, STRAND_N = 26, GHOST_N = 75, TURNS = 3;
      var R_BASE = 1.2, R_DEPTH = 1.8, R_MIN = 0.3;
      var COLOURS = ['#f87171', '#4ade80', '#60a5fa'], GHOST = '#8494a8'; // --fx/fy/fz-ink, dark theme
      var reduced = matchMedia('(prefers-reduced-motion: reduce)');
      var canvas = document.querySelector('.orb');
      var dpr = Math.min(2, window.devicePixelRatio || 1);
      canvas.width = Math.round(SIZE * dpr);
      canvas.height = Math.round(SIZE * dpr);
      var ctx = canvas.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      function frame(t) {
        var c = SIZE / 2, R = c * 0.76, rs = Math.pow(SIZE / 300, 0.6);
        var yaw = t * 0.4, sy = Math.sin(yaw), cy = Math.cos(yaw), st = Math.sin(0.3), ct = Math.cos(0.3);
        var dots = [];
        function add(x, y, z, r, a, col) {
          var x1 = x * cy + z * sy, z1 = -x * sy + z * cy;
          var z2 = y * st + z1 * ct, depth = (z2 / R + 1) / 2;
          var alpha = Math.min(1, a(depth));
          if (alpha >= 0.02) dots.push({ x: c + x1, y: c - (y * ct - z1 * st), z: z2, r: Math.max(R_MIN, r(depth)), a: alpha, col: col });
        }
        var golden = Math.PI * (3 - Math.sqrt(5));
        for (var i = 0; i < GHOST_N; i++) {
          var gy = 1 - (2 * (i + 0.5)) / GHOST_N, rad = Math.sqrt(1 - gy * gy), ga = i * golden;
          add(rad * Math.cos(ga) * R, gy * R, rad * Math.sin(ga) * R,
            function () { return 0.8 * rs; }, function (d) { return 0.1 + 0.22 * d; }, GHOST);
        }
        for (var s = 0; s < 3; s++) {
          var phase = (s / 3) * 2 * Math.PI;
          for (var j = 0; j < STRAND_N; j++) {
            var f = j / STRAND_N + t * 0.045, u = ((f - Math.floor(f)) * 2 - 1) * 0.96;
            var surf = Math.sqrt(Math.max(0, 1 - u * u)), endFade = Math.min(1, (1 - Math.abs(u)) / 0.1);
            var ang = u * Math.PI * TURNS + phase;
            var weave = 1 + 0.075 * Math.sin(u * Math.PI * TURNS * 2 + phase * 2 + t * 0.8);
            var rr = surf * R * weave;
            add(Math.cos(ang) * rr, u * R * weave, Math.sin(ang) * rr,
              function (d) { return (R_BASE + R_DEPTH * d) * rs; },
              (function (e) { return function (d) { return e * (0.45 + 0.55 * d); }; })(endFade), COLOURS[s]);
          }
        }
        dots.sort(function (p, q) { return p.z - q.z; });
        ctx.clearRect(0, 0, SIZE, SIZE);
        for (var k = 0; k < dots.length; k++) {
          ctx.globalAlpha = dots[k].a;
          ctx.fillStyle = dots[k].col;
          ctx.beginPath();
          ctx.arc(dots[k].x, dots[k].y, dots[k].r, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      // Reduced motion slows the orb rather than freezing it: a still one reads as a hang.
      (function loop() {
        frame((performance.now() / 1000) * SPEED * (reduced.matches ? 0.45 : 1));
        requestAnimationFrame(loop);
      })();
    })();
  </script>
</body>
</html>
