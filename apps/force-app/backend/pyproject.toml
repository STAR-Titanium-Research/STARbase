[project]
name = "force-app-backend"
version = "0.1.0"
description = "Standalone force app — local recording/acquisition backend (Phase 2, slice 2a: sim + live streaming)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "numpy>=1.26",
    "scipy>=1.11",
    "websockets>=12",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Real NI-DAQ acquisition (slice 2b). Needs the NI-DAQmx runtime installed on the host; only
# required on the acquisition PC. Install with:  pip install -e ".[nidaq]"
nidaq = ["nidaqmx>=1.0"]

# PyInstaller freeze (Electron packaging). Kept out of the base install — only needed when
# building the desktop app's sidecar, not for day-to-day backend development.
build = ["pyinstaller>=6.10"]

# This sub-app inherits the repo-wide ruff rule set but uses a wider line length — the
# backend was written at ~100 cols. Scoped here so the root stays at 88 for everything else.
[tool.ruff]
extend = "../../../pyproject.toml"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
# Slow tests (the 2 GB finalize memory bound) are deselected by default -- the release workflow and
# a plain `pytest` skip them; `pytest -m slow` runs only them (a later -m overrides this one).
addopts = "-q -m \"not slow\""
markers = ["slow: tens of seconds and gigabytes of disk; deselected by default, run with -m slow"]

[tool.setuptools.packages.find]
include = ["app*"]
