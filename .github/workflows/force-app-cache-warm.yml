name: force-app-cache-warm

# force-app-release.yml only ever runs on a `force-app-v*` tag push. GitHub Actions scopes a
# cache to the ref it was created on, falling back only to the default branch (main) -- never to
# another tag. Since force-app-release.yml's own cache steps only ever *save* on a tag ref, every
# release was a guaranteed miss (confirmed in the logs: identical key, "Cache saved" at the end of
# 0.1.19's run, "Cache not found" at the start of 0.1.20's, same lockfile hash both times) --
# structurally wasting ~3.5 min per release re-downloading Chromium + electron/nsis/winCodeSign.
#
# This workflow populates the SAME cache keys from a push to main instead, which IS a scope a
# tag-triggered run can fall back to. It only fires when package-lock.json actually changes --
# exactly when the hash-based key would change anyway -- so in steady state this never runs.
on:
  push:
    branches: [main]
    paths:
      - package-lock.json
  # Lets a maintainer force a re-warm without touching the lockfile -- e.g. to verify this
  # workflow after changing it, or if the cache was ever evicted for other reasons.
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  warm:
    name: Warm force-app-desktop release caches (Playwright + electron-builder)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: apps/force-app/backend/pyproject.toml

      # Same path + key as force-app-release.yml -- must match exactly for that workflow's restore
      # to hit.
      - name: Cache electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-builder-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install JS workspace dependencies
        run: npm ci

      - name: Build the web SPA
        run: npm run build:web:desktop

      - name: Install backend dependencies
        working-directory: apps/force-app/backend
        run: |
          $ErrorActionPreference = 'Stop'
          # Make a failing native command (npm, pip, electron-builder, ...) fail the step, not just
          # the last one in a multi-line block.
          $PSNativeCommandUseErrorActionPreference = $true
          python -m venv .venv
          .venv\Scripts\pip install -e ".[dev,build,nidaq]"

      - name: Freeze the backend with PyInstaller
        working-directory: apps/force-app/backend
        run: .venv\Scripts\pyinstaller force-app-backend.spec --noconfirm

      # Actually running electron-builder is what downloads winCodeSign/nsis into
      # electron-builder's cache dir -- there's no lighter way to warm it faithfully.
      - name: Build the Electron installer (warms electron-builder's tool downloads)
        working-directory: apps/force-app/desktop
        run: |
          $ErrorActionPreference = 'Stop'
          # Make a failing native command (npm, pip, electron-builder, ...) fail the step, not just
          # the last one in a multi-line block.
          $PSNativeCommandUseErrorActionPreference = $true
          npm run build
          npx electron-builder --win --publish never

      - name: Install Playwright browsers (warms the e2e smoke-test cache)
        working-directory: apps/force-app/desktop
        run: npx playwright install chromium --with-deps
