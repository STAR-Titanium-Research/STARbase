name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Re-run the whole suite on any branch from the Actions tab.
  workflow_dispatch:

# A new push to a PR cancels that PR's run still in progress. Runs on main are never cancelled:
# force-app-release.yml waits for main's CI result on the commit it is about to release.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: no job here writes to the repo, issues or PRs.
permissions:
  contents: read

jobs:
  # Which per-component builds this run needs (.github/scripts/ci-plan.mjs). Everything on main;
  # on a PR, only the extensions and service images it touches.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      images: ${{ steps.plan.outputs.images }}
      extensions: ${{ steps.plan.outputs.extensions }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # A PR is checked out as its merge commit, whose first parent is the base branch tip:
          # HEAD^1..HEAD is exactly what the PR changes.
          fetch-depth: 2
      - name: Work out the changed components
        id: plan
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$EVENT" == pull_request ]]; then
            mapfile -t files < <(git diff --name-only HEAD^1 HEAD)
            echo "${#files[@]} files changed"
            node .github/scripts/ci-plan.mjs "${files[@]}"
          else
            node .github/scripts/ci-plan.mjs
          fi

  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run pre-commit
        run: |
          pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure --color=always

  geometry:
    name: Sample geometry engine (unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Vendored copies in sync
        run: bash scripts/sync_geometry.sh --check
      - name: Unit tests
        run: node --experimental-strip-types --test core/extensions/d1-geometry-preview/test/geometry.test.ts
      - name: Extension endpoint tests
        run: node --test core/extensions/*/index.test.mjs
      # d1-ask-db's and d1-report's own suites run in the `extensions` job, after their npm ci.

  foundation:
    name: Foundation smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate repository foundation
        run: bash tests/phase0_smoke.sh
      # docker compose is preinstalled on ubuntu-latest runners, so the
      # compose-validation step inside the smoke test runs here too.

  migrations:
    name: Schema migrations (up + down + seed + schema tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: d1
          POSTGRES_PASSWORD: ci_secret
          POSTGRES_DB: d1_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://d1:ci_secret@localhost:5432/d1_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-db

      - name: Run Phase 1 schema tests
        run: bash tests/phase1_schema.sh

      - name: Run Phase 7 traceability tests
        run: bash tests/phase7_traceability.sh

      - name: Run Phase 6 AI-readiness tests
        run: bash tests/phase6_text_to_sql.sh

      # Rolls back every migration (each down must succeed), fails on any table, view, function,
      # type or schema left behind, then applies them all again.
      - name: Roll back everything, check nothing is left, re-apply
        run: bash scripts/ci/migration_roundtrip.sh

  script-tests:
    name: Scripts and diagnostics (pytest, incl. DB-level tests)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: d1
          POSTGRES_PASSWORD: ci_secret
          POSTGRES_DB: d1_scripts
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://d1:ci_secret@localhost:5432/d1_scripts?sslmode=disable
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      # The DB-level tests need the reference rows (e.g. manufacturing methods).
      - uses: ./.github/actions/setup-db

      # numpy/scipy/scikit-learn pinned to the plugins' versions: the diag goldens are exact for
      # these (scikit-learn 1.3's HDBSCAN labels differ).
      - name: Install dependencies
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q jq postgresql-client
          pip install -r scripts/requirements.txt pytest requests \
            "numpy==2.2.*" "scipy==1.14.*" "scikit-learn==1.5.*"

      # REQUIRE_DB_TESTS=1 makes tests/scripts/conftest.py fail any skipped test: the DB-level
      # tests skip themselves when the database, migrations, psql, jq or curl are missing, and a
      # job that skips them all would pass while testing nothing. -rs lists any skip's reason.
      - name: Run tests/scripts
        env:
          REQUIRE_DB_TESTS: "1"
        run: python -m pytest -q -rs tests/scripts

  # Every service image in docker-compose.yml is built here, and its tests run inside it, so a
  # broken Dockerfile or a dependency that won't install on the image's Python fails the PR rather
  # than the next `docker compose build` on the server.
  images:
    name: ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.images != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.images) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build ${{ matrix.image }}
        env:
          IMAGE: ${{ matrix.image }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          CONTEXT: ${{ matrix.context }}
        run: docker build -t "$IMAGE" -f "$DOCKERFILE" "$CONTEXT"
      - name: Run the tests inside the image
        if: matrix.test != ''
        env:
          IMAGE: ${{ matrix.image }}
          TEST: ${{ matrix.test }}
        run: docker run --rm "$IMAGE" sh -c "$TEST"

  # The Directus extensions with their own lockfile, outside the npm workspace (ci-plan.mjs lists
  # them). Each is installed and built exactly as on the server, plus its own tests if it has any.
  extensions:
    name: Directus extension ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.extensions != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.extensions) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Build
        if: matrix.build
        run: npm run build
      - name: Test
        if: matrix.test
        run: npm test

  # ---- Force app ------------------------------------------------------------------------------
  # The Windows-only parts (PyInstaller freeze, NSIS build, Playwright against the packaged app,
  # taskkill) run in force-app-release.yml: on every release, and as a dry run on any PR that
  # changes the app's version or packaging.

  force-app-js:
    name: Force app JS (plotting, web, desktop, Directus dashboard)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install workspace dependencies
        run: npm ci
      - name: "@d1/force-plotting: unit tests + typecheck"
        run: |
          npm test -w @d1/force-plotting
          npm run typecheck -w @d1/force-plotting
      - name: "force-app-web: unit tests + typecheck + theme lint"
        run: |
          npm test -w force-app-web
          npm run typecheck -w force-app-web
          npm run lint:theme -w force-app-web
      - name: "force-app-desktop: unit tests + typecheck"
        run: |
          npm test -w force-app-desktop
          npm run typecheck -w force-app-desktop
      - name: Build the web app (desktop base) and the Directus force dashboard
        run: |
          npm run build:web:desktop
          npm run build:extension

  # The Explorer pages (docs/superpowers/specs/2026-10-06-explorer-pages-design.md): the shared kit's
  # tests and typecheck, and a build of every Directus extension that imports it. Without the
  # builds a broken import in a page would only show up when someone rebuilds the extension.
  directus-ui:
    name: Explorer UI (@d1/ui and the six extensions that use it)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install workspace dependencies
        run: npm ci
      - name: "@d1/ui: unit tests + typecheck"
        run: |
          npm test -w @d1/ui
          npm run typecheck -w @d1/ui
      - name: Typecheck the Explorer pages, the lab dashboard and the campaign interface
        run: |
          npm run typecheck -w directus-extension-d1-home
          npm run typecheck -w directus-extension-d1-lab-dashboard
          npm run typecheck -w directus-extension-d1-campaign-ops
      - name: Build the Directus extensions that use @d1/ui
        run: npm run build:extensions

  force-app-python:
    name: Force app Python (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Same Python and extras as the release build, which freezes the backend on 3.11 with
          # the nidaq extra. Without the extra, nidaqmx-dependent paths took the "package not
          # installed" branch here and only failed on the release runner (force-app-v0.1.34).
          - name: recorder backend
            dir: apps/force-app/backend
            python: "3.11"
            install: -e .[dev,nidaq]
            deps: apps/force-app/backend/pyproject.toml
          # The services below run on python:3.12-slim (their Dockerfiles), so test on 3.12.
          - name: backup-server
            dir: apps/force-app/backup-server
            python: "3.12"
            install: -r requirements.txt
            deps: apps/force-app/backup-server/requirements.txt
          - name: bug-report-relay
            dir: apps/force-app/bug-report-relay
            python: "3.12"
            install: -r requirements.txt
            deps: apps/force-app/bug-report-relay/requirements.txt
          - name: filter-service
            dir: plugins/filter-service
            python: "3.12"
            install: -r requirements.txt
            deps: plugins/filter-service/requirements.txt
          - name: diag-service
            dir: plugins/diag-service
            python: "3.12"
            install: -r requirements.txt
            deps: plugins/diag-service/requirements.txt
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ${{ matrix.deps }}
      - name: Install dependencies
        run: pip install ${{ matrix.install }}
      - name: Run tests
        run: python -m pytest

  # One check that stands for the whole run, for branch protection: require "CI passed" and
  # nothing else, and jobs can be added, renamed or skipped by the plan without editing the rule.
  ci-passed:
    name: CI passed
    if: always()
    needs:
      - plan
      - lint
      - geometry
      - foundation
      - migrations
      - script-tests
      - images
      - extensions
      - force-app-js
      - directus-ui
      - force-app-python
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed or was not needed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if jq -e 'any(.[]; . == "failure" or . == "cancelled")' <<<"$RESULTS" >/dev/null; then
            echo "::error::A CI job failed or was cancelled"
            exit 1
          fi
