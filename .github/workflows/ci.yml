name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Re-run the whole suite on any branch from the Actions tab.
  workflow_dispatch:

# A new push to a PR cancels that PR's run still in progress. Runs on main are never cancelled:
# force-app-release.yml waits for main's CI result on the commit it is about to release.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: no job here writes to the repo, issues or PRs.
permissions:
  contents: read

jobs:
  # Which jobs this run needs (.github/scripts/ci-plan.mjs). Everything on main; on a PR, only the
  # jobs whose inputs it touches. Minutes are billed per job and rounded up, so the many small
  # components (extensions, images, Python services) run as loops inside one job each.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      migrations: ${{ steps.plan.outputs.migrations }}
      scripts: ${{ steps.plan.outputs.scripts }}
      forceAppJs: ${{ steps.plan.outputs.forceAppJs }}
      directusUi: ${{ steps.plan.outputs.directusUi }}
      backend: ${{ steps.plan.outputs.backend }}
      pyServices: ${{ steps.plan.outputs.pyServices }}
      images: ${{ steps.plan.outputs.images }}
      extensions: ${{ steps.plan.outputs.extensions }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # A PR is checked out as its merge commit, whose first parent is the base branch tip:
          # HEAD^1..HEAD is exactly what the PR changes.
          fetch-depth: 2
      - name: Work out the changed components
        id: plan
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$EVENT" == pull_request ]]; then
            mapfile -t files < <(git diff --name-only HEAD^1 HEAD)
            echo "${#files[@]} files changed"
            node .github/scripts/ci-plan.mjs "${files[@]}"
          else
            node .github/scripts/ci-plan.mjs
          fi

  # Always runs: the cheap checks share one job (one billed minute instead of four). Each step runs
  # even if an earlier one failed, so one run reports every failure.
  lint:
    name: Lint and quick checks (pre-commit, geometry, foundation smoke, CI plan)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run pre-commit
        run: |
          pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure --color=always
      - name: "Geometry: vendored copies in sync"
        if: ${{ !cancelled() }}
        run: bash scripts/sync_geometry.sh --check
      - name: "Geometry: unit tests"
        if: ${{ !cancelled() }}
        run: node --experimental-strip-types --test core/extensions/d1-geometry-preview/test/geometry.test.ts
      - name: Extension endpoint tests
        if: ${{ !cancelled() }}
        run: node --test core/extensions/*/index*.test.mjs
      - name: Deploy script and agent tests
        if: ${{ !cancelled() }}
        run: node --test scripts/deploy/*.test.mjs infra/deploy-agent/*.test.mjs
      - name: "STARbase compose wiring (parse-only)"
        if: ${{ !cancelled() }}
        run: node --test tests/starbase_compose.test.mjs
      # d1-ask-db's and d1-report's own suites run in the `extensions` job, after their npm ci.
      - name: CI plan tests
        if: ${{ !cancelled() }}
        run: node --test .github/scripts/ci-plan.test.mjs
      # docker compose is preinstalled on ubuntu-latest runners, so the compose-validation step
      # inside the smoke test runs here too.
      - name: Foundation smoke test
        if: ${{ !cancelled() }}
        run: bash tests/phase0_smoke.sh

  migrations:
    name: Schema migrations (up + down + seed + schema tests)
    needs: plan
    if: needs.plan.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: d1
          POSTGRES_PASSWORD: ci_secret
          POSTGRES_DB: d1_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://d1:ci_secret@localhost:5432/d1_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-db
      # The d1-inbox SQL checks in phase1 run the extension's own queries with node; without it they skip.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Run Phase 1 schema tests
        run: bash tests/phase1_schema.sh

      - name: Run People admin function tests
        run: bash tests/people_admin.sh

      - name: Run Teams tests
        run: bash tests/teams.sh

      - name: Run Phase 7 traceability tests
        run: bash tests/phase7_traceability.sh

      - name: Run Phase 6 AI-readiness tests
        run: bash tests/phase6_text_to_sql.sh

      # Rolls back every migration (each down must succeed), fails on any table, view, function,
      # type or schema left behind, then applies them all again.
      - name: Roll back everything, check nothing is left, re-apply
        run: bash scripts/ci/migration_roundtrip.sh

  script-tests:
    name: Scripts and diagnostics (pytest, incl. DB-level tests)
    needs: plan
    if: needs.plan.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: d1
          POSTGRES_PASSWORD: ci_secret
          POSTGRES_DB: d1_scripts
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://d1:ci_secret@localhost:5432/d1_scripts?sslmode=disable
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      # The DB-level tests need the reference rows (e.g. manufacturing methods).
      - uses: ./.github/actions/setup-db

      # numpy/scipy/scikit-learn pinned to the plugins' versions: the diag goldens are exact for
      # these (scikit-learn 1.3's HDBSCAN labels differ).
      - name: Install dependencies
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q jq postgresql-client
          pip install -r scripts/requirements.txt pytest requests \
            "numpy==2.2.*" "scipy==1.14.*" "scikit-learn==1.5.*" "h5py==3.12.*"

      # REQUIRE_DB_TESTS=1 makes tests/scripts/conftest.py fail any skipped test: the DB-level
      # tests skip themselves when the database, migrations, psql, jq or curl are missing, and a
      # job that skips them all would pass while testing nothing. -rs lists any skip's reason.
      - name: Run tests/scripts
        env:
          REQUIRE_DB_TESTS: "1"
        run: python -m pytest -q -rs tests/scripts

  # Every service image in docker-compose.yml that the plan selected: built, then its tests run inside
  # it, so a broken Dockerfile or a dependency that won't install on the image's Python fails the
  # PR rather than the next `docker compose build` on the server.
  images:
    name: Service images (docker build + tests)
    needs: plan
    if: needs.plan.outputs.images != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build each image and run its tests
        env:
          IMAGES: ${{ needs.plan.outputs.images }}
        run: |
          failed=()
          for i in $(seq 0 $(( $(jq length <<<"$IMAGES") - 1 ))); do
            field() { jq -r ".[$i].$1" <<<"$IMAGES"; }
            name=$(field name); image=$(field image); test=$(field test)
            echo "::group::$name"
            if docker build -t "$image" -f "$(field dockerfile)" "$(field context)" \
               && { [[ -z "$test" ]] || docker run --rm "$image" sh -c "$test"; }; then
              echo "::endgroup::"
            else
              echo "::endgroup::"; echo "::error::$name failed"; failed+=("$name")
            fi
          done
          (( ${#failed[@]} == 0 ))

  # The Directus extensions with their own lockfile, outside the npm workspace (ci-plan.mjs lists
  # them). Each selected one is installed and built exactly as on the server, plus its own tests.
  extensions:
    name: Directus extensions (own lockfiles)
    needs: plan
    if: needs.plan.outputs.extensions != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: core/extensions/*/package-lock.json
      - name: Install, build and test each extension
        env:
          EXTENSIONS: ${{ needs.plan.outputs.extensions }}
        run: |
          failed=()
          for i in $(seq 0 $(( $(jq length <<<"$EXTENSIONS") - 1 ))); do
            field() { jq -r ".[$i].$1" <<<"$EXTENSIONS"; }
            name=$(field name); dir=$(field dir)
            echo "::group::$name"
            if ( cd "$dir" && npm ci --no-audit --no-fund \
                 && { [[ $(field build) != true ]] || npm run build; } \
                 && { [[ $(field test) != true ]] || npm test; } ); then
              echo "::endgroup::"
            else
              echo "::endgroup::"; echo "::error::$name failed"; failed+=("$name")
            fi
          done
          (( ${#failed[@]} == 0 ))

  # ---- Force app ------------------------------------------------------------------------------
  # The Windows-only parts (PyInstaller freeze, NSIS build, Playwright against the packaged app,
  # taskkill) run in force-app-release.yml: on every release, and as a dry run on any PR that
  # changes the app's version or packaging.

  force-app-js:
    name: Force app JS (plotting, web, desktop, Directus dashboard)
    needs: plan
    if: needs.plan.outputs.forceAppJs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install workspace dependencies
        run: npm ci
      - name: "@d1/force-plotting: unit tests + typecheck"
        run: |
          npm test -w @d1/force-plotting
          npm run typecheck -w @d1/force-plotting
      - name: "force-app-web: unit tests + typecheck + theme lint"
        run: |
          npm test -w force-app-web
          npm run typecheck -w force-app-web
          npm run lint:theme -w force-app-web
      - name: "force-app-desktop: unit tests + typecheck"
        run: |
          npm test -w force-app-desktop
          npm run typecheck -w force-app-desktop
      - name: Build the web app (desktop base)
        run: npm run build:web:desktop

  # The Explorer pages (docs/superpowers/specs/2026-10-06-explorer-pages-design.md): the shared kit's
  # tests and typecheck, and a build of every Directus extension that imports it. Without the
  # builds a broken import in a page would only show up when someone rebuilds the extension.
  directus-ui:
    name: Explorer UI and STARbase (@d1/ui, the extensions that use it, apps/starbase/web)
    needs: plan
    if: needs.plan.outputs.directusUi == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install workspace dependencies
        run: npm ci
      - name: "@d1/ui: unit tests + typecheck"
        run: |
          npm test -w @d1/ui
          npm run typecheck -w @d1/ui
          npm test -w @d1/fast-plotting
          npm run typecheck -w @d1/fast-plotting
          npm test -w @d1/directus-host
          npm run typecheck -w @d1/directus-host
          npm test -w @d1/starbase-pages
          npm run typecheck -w @d1/starbase-pages
      - name: Typecheck the edit frame, the lab dashboard and the campaign interface
        run: |
          npm run typecheck -w directus-extension-d1-edit-frame
          npm run typecheck -w directus-extension-d1-lab-dashboard
          npm run typecheck -w directus-extension-d1-campaign-ops
      - name: Build the Directus extensions that use @d1/ui
        run: npm run build:extensions
      - name: "STARbase app: unit tests + typecheck + build"
        run: |
          npm test -w starbase-web
          npm run typecheck -w starbase-web
          npm run build -w starbase-web

  # Same Python and extras as the release build, which freezes the backend on 3.11 with the nidaq
  # extra. Without the extra, nidaqmx-dependent paths took the "package not installed" branch here
  # and only failed on the release runner (force-app-v0.1.34).
  force-app-backend:
    name: Force app Python (recorder backend)
    needs: plan
    if: needs.plan.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/force-app/backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/force-app/backend/pyproject.toml
      - name: Install dependencies
        run: pip install -e ".[dev,nidaq]"
      - name: Run tests
        run: python -m pytest

  # The services run on python:3.12-slim (their Dockerfiles), so they are tested on 3.12, each in its
  # own venv so their pins can't mix.
  python-services:
    name: Python services (backup server, bug-report relay, filter, diag)
    needs: plan
    if: needs.plan.outputs.pyServices != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/force-app/backup-server/requirements.txt
            apps/force-app/bug-report-relay/requirements.txt
            plugins/filter-service/requirements.txt
            plugins/diag-service/requirements.txt
      - name: Install and test each service
        env:
          SERVICES: ${{ needs.plan.outputs.pyServices }}
        run: |
          failed=()
          for i in $(seq 0 $(( $(jq length <<<"$SERVICES") - 1 ))); do
            name=$(jq -r ".[$i].name" <<<"$SERVICES"); dir=$(jq -r ".[$i].dir" <<<"$SERVICES")
            echo "::group::$name"
            if python -m venv "$RUNNER_TEMP/venv-$name" \
               && "$RUNNER_TEMP/venv-$name/bin/pip" install -q -r "$dir/requirements.txt" \
               && ( cd "$dir" && "$RUNNER_TEMP/venv-$name/bin/python" -m pytest ); then
              echo "::endgroup::"
            else
              echo "::endgroup::"; echo "::error::$name failed"; failed+=("$name")
            fi
          done
          (( ${#failed[@]} == 0 ))

  # One check that stands for the whole run, for branch protection: require "CI passed" and
  # nothing else, and jobs can be added, renamed or skipped by the plan without editing the rule.
  ci-passed:
    name: CI passed
    if: always()
    needs:
      - plan
      - lint
      - migrations
      - script-tests
      - images
      - extensions
      - force-app-js
      - directus-ui
      - force-app-backend
      - python-services
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed or was not needed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if jq -e 'any(.[]; . == "failure" or . == "cancelled")' <<<"$RESULTS" >/dev/null; then
            echo "::error::A CI job failed or was cancelled"
            exit 1
          fi
